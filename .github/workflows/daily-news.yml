name: Daily News Briefing

on:
  schedule:
    # Every weekday at 6:00 UTC (8:00 UTC+3)
    # Syntax: minute hour day month day-of-week
    - cron: '0 6 * * 1-5'  # Mon-Fri only

  # For manual testing
  workflow_dispatch:

jobs:
  send-news:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      
      - name: Install dependencies
        run: npm install
      
      - name: Run news bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm start
      
      - name: Log status
        if: always()
        run: echo "Daily news job completed"